[project]
name = "codeflow-benchmark"
version = "0.1.0"
description = "Benchmark harness for CodeFlow decision-flow graphs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
