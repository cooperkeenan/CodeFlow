<svg width="100%" viewBox="0 0 680 160" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Hub and spoke diagram template</title>
<desc>Central hub node with five spoke nodes radiating outward</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="255" y="52" width="120" height="40" rx="20" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="315" y="77" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">API Gateway</text>

<line x1="255" y1="67" x2="165" y2="67" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="55"  y="50" width="110" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2C2C2A">Auth service</text>

<line x1="263" y1="52" x2="178" y2="20" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="75"  y="6"  width="103" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="126" y="28" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2C2C2A">User service</text>

<line x1="315" y1="52" x2="315" y2="20" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="255" y="6"  width="120" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="315" y="28" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2C2C2A">Order service</text>

<line x1="367" y1="52" x2="452" y2="20" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="452" y="6"  width="120" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="512" y="28" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2C2C2A">Payment service</text>

<line x1="375" y1="67" x2="465" y2="67" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="465" y="50" width="120" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="525" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2C2C2A">Notify service</text>

<text x="340" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">Hub first in nodes array — max 8 spokes</text>
</svg>
