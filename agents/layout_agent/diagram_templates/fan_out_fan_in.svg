<svg width="100%" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Fan-out fan-in diagram template</title>
<desc>Dispatcher fans out to four parallel workers which converge into an aggregator</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="280" y="20" width="100" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="43" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Dispatcher</text>

<line x1="330" y1="56" x2="100"  y2="96"  stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="330" y1="56" x2="230"  y2="96"  stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="330" y1="56" x2="390"  y2="96"  stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="330" y1="56" x2="520"  y2="96"  stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="50"  y="96" width="100" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="100" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Worker 1</text>

<rect x="180" y="96" width="100" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="230" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Worker 2</text>

<rect x="340" y="96" width="100" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="390" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Worker 3</text>

<rect x="470" y="96" width="100" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="520" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Worker 4</text>

<line x1="100"  y1="130" x2="304" y2="166" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="230"  y1="130" x2="316" y2="166" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="390"  y1="130" x2="344" y2="166" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="520"  y1="130" x2="356" y2="166" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="280" y="166" width="100" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="189" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Aggregator</text>

<text x="340" y="218" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">Dispatcher and aggregator first/last in nodes array — max 8 workers</text>
</svg>
