<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
 width="936" height="420"
 viewBox="0 0 936 420">
<defs>
<pattern id="minorGrid" width="10" height="10" patternUnits="userSpaceOnUse">
<path d="M 10 0 L 0 0 L 0 10" fill="none" stroke="#e8e8e8" stroke-width="1"/>
</pattern>
<pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
<rect width="100" height="100" fill="url(#minorGrid)"/>
<path d="M 100 0 L 0 0 L 0 100" fill="none" stroke="#d5d5d5" stroke-width="1.4"/>
</pattern>
<marker id="arrowhead" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="8"
 refX="10.5" refY="4" orient="auto">
<path d="M 0 0 L 10.5 4 L 0 8 z" fill="#4d4d4d"/>
</marker>
</defs>
<rect class="grid" x="0" y="0" width="936" height="420" fill="#ffffff"/>
<rect class="grid" x="0" y="0" width="936" height="420" fill="url(#majorGrid)"/>
<rect class="box" x="30.0" y="50.0" width="177.3" height="52.0" rx="4" ry="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.6"/>
<text class="label" x="118.6" y="80.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle" xml:space="preserve">Candidate dispatch sites</text>
<rect class="box" x="30.0" y="126.0" width="177.3" height="52.0" rx="4" ry="4" fill="#ffffff" stroke="#4d4d4d" stroke-width="1.6"/>
<text class="label" x="118.6" y="156.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle" xml:space="preserve">Damp high fan-in helpers</text>
<path class="edge" d="M 118.6,102.0 L 118.6,126.0" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
<rect class="box" x="30.0" y="202.0" width="177.3" height="52.0" rx="4" ry="4" fill="#ffffff" stroke="#4d4d4d" stroke-width="1.6"/>
<text class="label" x="118.6" y="232.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle" xml:space="preserve">Compute arm reach</text>
<path class="edge" d="M 118.6,178.0 L 118.6,202.0" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
<rect class="box" x="30.0" y="278.0" width="177.3" height="52.0" rx="4" ry="4" fill="#ffffff" stroke="#4d4d4d" stroke-width="1.6"/>
<text class="label" x="118.6" y="300.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle" xml:space="preserve">Classify each arm</text>
<text class="label" x="118.6" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4d4d4d" text-anchor="middle" xml:space="preserve">guard / void / live</text>
<path class="edge" d="M 118.6,254.0 L 118.6,278.0" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
<path class="edge" d="M 207.3,304.0 L 242.3,304.0 L 242.3,190.0 L 277.3,190.0" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
<rect class="box" x="277.3" y="134.0" width="225.2" height="112.0" rx="4" ry="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.6"/>
<text class="label" x="293.3" y="154.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start" xml:space="preserve">Four-term score</text>
<text class="label" x="293.3" y="170.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="start" xml:space="preserve">•  log of live reach union</text>
<text class="label" x="293.3" y="186.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="start" xml:space="preserve">•  provenance of tested value</text>
<text class="label" x="293.3" y="202.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="start" xml:space="preserve">•  arms fail to reconverge</text>
<text class="label" x="293.3" y="218.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="start" xml:space="preserve">•  route, table, polymorphic bonus</text>
<text class="label" x="389.9" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4d4d4d" text-anchor="middle" xml:space="preserve">deterministic</text>
<path class="edge" d="M 502.5,190.0 L 572.5,190.0" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
<rect class="box" x="572.5" y="148.0" width="145.2" height="84.0" rx="4" ry="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.6"/>
<text class="label" x="645.1" y="170.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle" xml:space="preserve">Model verdict</text>
<text class="label" x="645.1" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4d4d4d" text-anchor="middle" xml:space="preserve">decision / guard / noise</text>
<text class="label" x="645.1" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4d4d4d" text-anchor="middle" xml:space="preserve">temperature zero</text>
<text class="label" x="645.1" y="218.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4d4d4d" text-anchor="middle" xml:space="preserve">cached by content</text>
<path class="edge" d="M 717.7,190.0 L 741.7,190.0" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round"/>
<path class="edge" d="M 741.7,114.0 L 741.7,266.0" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round"/>
<path class="edge" d="M 741.7,114.0 L 791.7,114.0" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
<rect class="box" x="791.7" y="88.0" width="114.4" height="52.0" rx="4" ry="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.6"/>
<text class="label" x="848.9" y="118.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle" xml:space="preserve">Decision node</text>
<path class="edge" d="M 741.7,190.0 L 791.7,190.0" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
<rect class="box" x="791.7" y="164.0" width="114.4" height="52.0" rx="4" ry="4" fill="#ffffff" stroke="#4d4d4d" stroke-width="1.6"/>
<text class="label" x="848.9" y="194.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle" xml:space="preserve">Guarded step</text>
<path class="edge" d="M 741.7,266.0 L 791.7,266.0" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
<rect class="box" x="791.7" y="240.0" width="114.4" height="52.0" rx="4" ry="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.6"/>
<text class="label" x="848.9" y="270.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle" xml:space="preserve">Discarded</text>
<text class="label" x="468.1" y="370.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4d4d4d" text-anchor="middle" xml:space="preserve">The deterministic stage ranks. The model stage decides which candidates survive to the page.</text>
</svg>
