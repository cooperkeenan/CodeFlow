name: CD

on:
  push:
    branches: [main]

jobs:
  push-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        service:
          - { name: api,      dir: api }
          - { name: profiler, dir: agents/profiler_agent }
          - { name: tracer,   dir: agents/tracer_agent }
          - { name: render,   dir: agents/render_agent }
          - { name: layout,   dir: agents/layout_agent }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          build-args: SERVICE_DIR=${{ matrix.service.dir }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/codeflow-${{ matrix.service.name }}:latest
            ghcr.io/${{ github.repository_owner }}/codeflow-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  deploy:
    needs: push-images
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Redeploy all services
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          for service in api profiler tracer render layout; do
            railway redeploy --service $service --yes
          done
