<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
 width="882" height="402"
 viewBox="0 0 882 402">
<defs>
<pattern id="minorGrid" width="10" height="10" patternUnits="userSpaceOnUse">
<path d="M 10 0 L 0 0 L 0 10" fill="none" stroke="#e8e8e8" stroke-width="1"/>
</pattern>
<pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
<rect width="100" height="100" fill="url(#minorGrid)"/>
<path d="M 100 0 L 0 0 L 0 100" fill="none" stroke="#d5d5d5" stroke-width="1.4"/>
</pattern>
<marker id="arrowhead" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="8"
 refX="10.5" refY="4" orient="auto">
<path d="M 0 0 L 10.5 4 L 0 8 z" fill="#4d4d4d"/>
</marker>
</defs>
<rect class="grid" x="0" y="0" width="882" height="402" fill="#ffffff"/>
<rect class="grid" x="0" y="0" width="882" height="402" fill="url(#majorGrid)"/>
<text class="label" x="30.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start" xml:space="preserve">Source</text>
<rect class="box" x="30.0" y="74.0" width="288.1" height="136.0" rx="4" ry="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.6"/>
<text class="label" x="48.0" y="98.0" font-family="Courier, monospace" font-size="12" fill="#000000" text-anchor="start" xml:space="preserve">def view(request, ticket):</text>
<text class="label" x="48.0" y="118.0" font-family="Courier, monospace" font-size="12" fill="#000000" text-anchor="start" xml:space="preserve">    if user_can_edit(request.user):</text>
<text class="label" x="48.0" y="138.0" font-family="Courier, monospace" font-size="12" fill="#000000" text-anchor="start" xml:space="preserve">        return edit_form(ticket)</text>
<text class="label" x="48.0" y="174.0" font-family="Courier, monospace" font-size="12" fill="#000000" text-anchor="start" xml:space="preserve">    else:</text>
<text class="label" x="48.0" y="194.0" font-family="Courier, monospace" font-size="12" fill="#000000" text-anchor="start" xml:space="preserve">        return deny(request)</text>
<rect class="frame" x="38.0" y="104.0" width="272.1" height="41.0" rx="4" ry="4" fill="none" stroke="#82b366" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect class="frame" x="38.0" y="160.0" width="221.7" height="41.0" rx="4" ry="4" fill="none" stroke="#d79b00" stroke-width="1.6" stroke-dasharray="5 4"/>
<text class="label" x="378.1" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start" xml:space="preserve">Conventional call graph</text>
<rect class="box" x="448.1" y="74.0" width="100.0" height="50.0" rx="4" ry="4" fill="#ffffff" stroke="#4d4d4d" stroke-width="1.6"/>
<text class="label" x="498.1" y="103.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle" xml:space="preserve">view</text>
<rect class="box" x="378.1" y="188.0" width="100.0" height="50.0" rx="4" ry="4" fill="#ffffff" stroke="#4d4d4d" stroke-width="1.6"/>
<text class="label" x="428.1" y="217.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle" xml:space="preserve">edit_form</text>
<rect class="box" x="518.1" y="188.0" width="100.0" height="50.0" rx="4" ry="4" fill="#ffffff" stroke="#4d4d4d" stroke-width="1.6"/>
<text class="label" x="568.1" y="217.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle" xml:space="preserve">deny</text>
<path class="edge" d="M 498.1,124.0 L 498.1,156.0 L 428.1,156.0 L 428.1,188.0" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
<path class="edge" d="M 498.1,124.0 L 498.1,156.0 L 568.1,156.0 L 568.1,188.0" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
<text class="label" x="498.1" y="324.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4d4d4d" text-anchor="middle" xml:space="preserve">Two edges. The branch arm each call sits</text>
<text class="label" x="498.1" y="342.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4d4d4d" text-anchor="middle" xml:space="preserve">under is discarded.</text>
<text class="label" x="678.1" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start" xml:space="preserve">CodeFlow call sites</text>
<rect class="box" x="678.1" y="74.0" width="174.4" height="96.0" rx="4" ry="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.6"/>
<rect class="box" x="678.1" y="198.0" width="174.4" height="96.0" rx="4" ry="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.6"/>
<text class="label" x="694.1" y="108.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="start" xml:space="preserve">caller: view</text>
<text class="label" x="694.1" y="126.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="start" xml:space="preserve">target: edit_form</text>
<text class="label" x="694.1" y="144.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="start" xml:space="preserve">enclosing: branch, arm 1</text>
<text class="label" x="694.1" y="232.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="start" xml:space="preserve">caller: view</text>
<text class="label" x="694.1" y="250.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="start" xml:space="preserve">target: deny</text>
<text class="label" x="694.1" y="268.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="start" xml:space="preserve">enclosing: branch, arm 2</text>
<text class="label" x="765.3" y="324.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4d4d4d" text-anchor="middle" xml:space="preserve">The same two edges, each</text>
<text class="label" x="765.3" y="342.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4d4d4d" text-anchor="middle" xml:space="preserve">carrying the arm it was reached</text>
<text class="label" x="765.3" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4d4d4d" text-anchor="middle" xml:space="preserve">through.</text>
</svg>
